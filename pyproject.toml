[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-vault"
version = "0.2.0"
description = "Sync agent skills across Claude Code, OpenClaw, Perplexity Computer, Cursor, and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Tommy Puglia" },
]
keywords = ["agent-skills", "claude", "openclaw", "perplexity", "ai", "sync", "agentskills"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "watchdog>=4.0",
    "pyyaml>=6.0",
    "questionary>=2.0",
]

[project.scripts]
skill-vault = "skill_vault.cli:cli"
sv = "skill_vault.cli:cli"

[project.urls]
Homepage = "https://github.com/pugliabi/skill-vault"
Repository = "https://github.com/pugliabi/skill-vault"
Issues = "https://github.com/pugliabi/skill-vault/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
