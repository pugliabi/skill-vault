<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <radialGradient id="dial" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </radialGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- rounded app tile -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#bg)"/>
  <rect x="36" y="36" width="440" height="440" rx="104" fill="none" stroke="#312E81" stroke-opacity="0.25" stroke-width="4"/>

  <!-- vault door plate -->
  <g filter="url(#ds)">
    <rect x="120" y="120" width="272" height="272" rx="40" fill="url(#metal)"/>
    <rect x="120" y="120" width="272" height="272" rx="40" fill="none" stroke="#4F46E5" stroke-opacity="0.35" stroke-width="6"/>
  </g>

  <!-- corner bolts -->
  <g fill="#6366F1" opacity="0.55">
    <circle cx="156" cy="156" r="11"/>
    <circle cx="356" cy="156" r="11"/>
    <circle cx="156" cy="356" r="11"/>
    <circle cx="356" cy="356" r="11"/>
  </g>

  <!-- dial ring -->
  <circle cx="256" cy="256" r="96" fill="none" stroke="#6366F1" stroke-width="14" stroke-opacity="0.85"/>
  <circle cx="256" cy="256" r="74" fill="url(#dial)" stroke="#4F46E5" stroke-width="6"/>

  <!-- dial spokes -->
  <g stroke="#4F46E5" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="150" x2="256" y2="186"/>
    <line x1="256" y1="326" x2="256" y2="362"/>
    <line x1="150" y1="256" x2="186" y2="256"/>
    <line x1="326" y1="256" x2="362" y2="256"/>
  </g>

  <!-- skill spark / star at the hub -->
  <path d="M256 210
           c8 28 16 36 44 44
           c-28 8 -36 16 -44 44
           c-8 -28 -16 -36 -44 -44
           c28 -8 36 -16 44 -44 Z"
        fill="#4338CA"/>
  <circle cx="256" cy="256" r="9" fill="#EEF2FF"/>
</svg>
